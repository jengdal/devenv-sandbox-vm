# The documentation site (docs/) on GitHub Pages. A pull request only builds the site. A push
# to main builds it and publishes it at https://jengdal.github.io/devenv-sandbox-vm/.
#
# The repo settings must have Settings → Pages → Source: GitHub Actions.
#
# This workflow does not check the links to headings: `devenv test` does that, in test.yml.
#
# mdbook comes from the devenv of this repo, thus it has the version of devenv.lock. Forgejo
# has no Pages and does not read this file.
#
# Each action is pinned to the commit of a release, with the release in a comment. To
# update an action, use the commit of its new release tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          # The same settings as in test.yml.
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/*.lock', 'devenv.yaml', '**/*.patch') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ github.job }}-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix shell nixpkgs#devenv --command devenv shell -- mdbook build docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
