# The development environment of this repo. A project that uses devenv-sandbox-vm does not
# read this file. It imports the directory host/.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
